upstream crm_backend {
    server ${CRM_BACKEND};
}

server {
    listen 80;
    listen [::]:80;
    # server_name ep-crm-demo;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 20m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json image/svg+xml;
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=31536000, immutable, no-transform";
    }
    location = /index.html {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location = /session-expired {
        return 401 "Unauthorized";
    }
    location /assets/ {
        expires off;
        add_header Cache-Control "public, max-age=3600";
    }
    location /locale/ {
        expires off;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /favicon.ico {
        expires off;
        add_header Cache-Control "public, max-age=86400";
        log_not_found off;
        access_log off;
    }
    location ~ ^/crm/([_0-9a-zA-Z-]+)(.*)$ {
        set $crm_key $1;
        set $crm_rest $2;
        set $mapped_url "";
        # >>> generated from src/app/config/service-routes.json by "pnpm routes:sync" — do not edit by hand
        if ($crm_key = "ping") { set $mapped_url "/api/HealthCheck/Ping"; }
        if ($crm_key = "login") { set $mapped_url "/ServiceModel/AuthService.svc/Login"; }
        if ($crm_key = "logout") { set $mapped_url "${CRM_WORKSPACE}/rest/MainMenuService/Logout"; }
        if ($crm_key = "currentUserInfo") { set $mapped_url "${CRM_WORKSPACE}/ServiceModel/UserInfoService.svc/GetCurrentUserInfo"; }
        if ($crm_key = "select") { set $mapped_url "${CRM_WORKSPACE}/DataService/json/SyncReply/SelectQuery"; }
        if ($crm_key = "insert") { set $mapped_url "${CRM_WORKSPACE}/DataService/json/SyncReply/InsertQuery"; }
        if ($crm_key = "update") { set $mapped_url "${CRM_WORKSPACE}/DataService/json/SyncReply/UpdateQuery"; }
        if ($crm_key = "delete") { set $mapped_url "${CRM_WORKSPACE}/DataService/json/SyncReply/DeleteQuery"; }
        if ($crm_key = "batch") { set $mapped_url "${CRM_WORKSPACE}/DataService/json/SyncReply/BatchQuery"; }
        if ($crm_key = "entitySchemaManager") { set $mapped_url "${CRM_WORKSPACE}/DataService/json/SyncReply/EntitySchemaManagerRequest"; }
        if ($crm_key = "entitySchema") { set $mapped_url "${CRM_WORKSPACE}/DataService/json/SyncReply/EntitySchemaRequest"; }
        if ($crm_key = "entityImg") { set $mapped_url "${CRM_WORKSPACE}/img/entity/hash/SysImage/Data"; }
        if ($crm_key = "rights") { set $mapped_url "${CRM_WORKSPACE}/rest/RightsService/GetSchemaOperationRightLevel"; }
        if ($crm_key = "runProcess") { set $mapped_url "${CRM_WORKSPACE}/ServiceModel/ProcessEngineService.svc/RunProcess"; }
        if ($crm_key = "deleteRecords") { set $mapped_url "${CRM_WORKSPACE}/rest/GridUtilitiesService/DeleteRecordsAsync"; }
        # <<< end of the generated block
        if ($mapped_url = "") {
            return 404;
        }
        proxy_pass http://crm_backend$mapped_url$crm_rest$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
        proxy_redirect ~*^https?://[^/]+/.*Login\.html.*$ $scheme://$http_host/session-expired;
        proxy_cookie_path ~^/\d+/?(.*)$ /$1;
    }
}
